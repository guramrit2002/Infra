services:
  traefik:
    image: traefik:v3

    container_name: traefik

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml
      - ./acme.json:/acme.json

    command:
      - --configFile=/traefik.yml

    networks:
      - spider

networks:
  spider:
    external: true
